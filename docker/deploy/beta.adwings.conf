server {
    listen 80;
    listen [::]:80;
    server_name beta.adwings.ge;
    return 301 https://beta.adwings.ge$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;
    server_name beta.adwings.ge;

    ssl_certificate /etc/letsencrypt/live/beta.adwings.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.adwings.ge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_early_data off;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
