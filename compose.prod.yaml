# Combine with compose.yaml; never include compose.dev.yaml on the VPS.
services:
  app:
    image: tanstack-employee-tracker:local
    build:
      context: .
      target: runtime
    profiles: [production]
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-employee_tracking}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-employee_tracking}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3005}
      REDIS_URL: ${REDIS_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - '127.0.0.1:${APP_PORT:-3005}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [backend]
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  proxy:
    image: caddy:2.10-alpine
    profiles: [proxy]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  backup:
    image: postgres:18-bookworm
    profiles: [backups]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT:-5433}
      PGUSER: ${POSTGRES_USER:-employee_tracking}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-employee_tracking}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint: [/bin/sh, /scripts/backup.sh]
    volumes:
      - ./docker/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
